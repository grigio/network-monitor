name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust + bpf-linker
        run: |
          rustup toolchain install nightly
          rustup target add bpfel-unknown-none --toolchain nightly
          cargo install bpf-linker
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libcairo2-dev \
            libharfbuzz-dev
      - name: Set PKG_CONFIG_PATH
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Smoke test — version
        run: timeout 3 ./target/debug/nmt --version
      - name: Smoke test — as normal user (expect clean error, no terminal corruption)
        run: |
          set +e
          output=$(timeout 5 ./target/debug/nmt 2>&1)
          rc=$?
          set -e
          echo "$output"
          # Must exit with error BEFORE terminal setup (no raw mode corruption)
          if [ "$rc" -eq 1 ]; then
            echo "✓ nmt exited with code 1 (expected)"
          else
            echo "⚠ Unexpected exit code: $rc"
            exit 1
          fi
      - name: Smoke test — as root (expect clean startup or clean error)
        run: |
          set +e
          output=$(timeout 5 sudo -E ./target/debug/nmt 2>&1)
          rc=$?
          set -e
          echo "$output"
          # Root may succeed if eBPF works, or fail with clean error
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            echo "✓ nmt exited cleanly (code $rc)"
          else
            echo "⚠ Unexpected exit code: $rc"
            exit 1
          fi
