name: update-cargo-deps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (GTK4, Adwaita, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev libgraphene-1.0-dev libcairo2-dev libharfbuzz-dev

      - name: Setup Rust
        run: rustup toolchain install stable --component rust-src

      - name: Install cargo-edit and cargo-deny
        run: |
          cargo install cargo-edit --locked
          cargo install cargo-deny --locked

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create working branch
        run: git checkout -B auto/update-cargo-deps

      - name: Update workspace Cargo.toml deps
        run: cargo upgrade

      - name: Update workspace Cargo.lock
        run: cargo update --workspace

      - name: Update eBPF Cargo.toml deps
        working-directory: network-monitor-ebpf
        run: cargo upgrade

      - name: Update eBPF Cargo.lock
        working-directory: network-monitor-ebpf
        run: cargo update

      - name: Validate build and deny rules
        run: |
          cargo check --workspace
          cargo deny check

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake.lock
        run: nix flake update

      - name: Commit changes
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "chore: weekly cargo and flake dependency update"

      - name: Push branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin auto/update-cargo-deps --force

      - name: Create PR
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base master \
            --head auto/update-cargo-deps \
            --title "chore: weekly cargo and flake dependency update" \
            --body "Automated weekly \`cargo upgrade\`, \`cargo update\`, and \`nix flake update\`.

            - All cargo dependencies bumped to latest compatible versions.
            - Flake inputs (nixpkgs, flake-utils) updated.
            - Validated with \`cargo check\`.") || true
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        if: steps.create-pr.outputs.pr-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash "${{ steps.create-pr.outputs.pr-url }}" || true
